name: eval-gate
on: [push, pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # 依赖安装：uv sync 会按 backend/pyproject.toml 建 backend/.venv 并装齐依赖
      # （与 requirements.txt 内容一致：mcp + pyyaml），后续 uv run 直接复用该环境。
      # 不要用 `uv pip install --system`——runner 的系统 Python 是 PEP 668
      # externally-managed，会直接以 exit 2 失败（且装了也无人使用）。
      - name: Install dependencies
        run: uv sync --project backend
      - run: uv run --project backend python -m seed.seed --out backend/seed/sample.db --seed 42
      # 本体编译（1B）：YAML → SQLite 产物，验证编译流水线 + SqliteStore 可读
      - run: uv run --project backend python -m ontology_compile --yaml backend/ontology --out /tmp/ontology.db --commit
      - run: DATA_AGENT_ONTOLOGY_STORE=sqlite DATA_AGENT_ONTOLOGY_DB=/tmp/ontology.db uv run --project backend python -m eval.eval
      - run: uv run --project backend python -m eval.eval
      # 引擎单元测试（安全/方言/可观测/元数据/建模/路径D/本体存储/同步）
      # 注意：unittest discover 的 -s 是相对**当前工作目录**的路径，且 backend 内的
      # 模块（core/seed/eval...）以 backend 为导入根，所以这两步的 cwd 必须是
      # backend/（`uv run --project backend` 只指定项目，不会切换 cwd）。
      - name: Engine unit tests
        run: uv run python -m unittest discover -s tests
        working-directory: backend
      # DSH 侧配置回归（patch 格式 / upsert 幂等 / DSH 版本兼容）
      - name: DSH-side config regression
        run: uv run python -m unittest discover -s ../dsh-side
        working-directory: backend
      # 本体同步检查（多人编辑闭环）：配置 Supabase Secrets 后验证 YAML↔DB 一致
      # 注意：`secrets` 上下文在 step 级 `if` 中不可用——写成
      # `if: ${{ secrets.X != '' }}` 会让整个 workflow 校验失败（一个 job 都不会
      # 创建：run 显示 failed，但 /jobs 接口返回空）。必须经 env 传入后在 shell 里判断。
      - name: Ontology sync check (optional)
        env:
          DATA_AGENT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DATA_AGENT_SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$DATA_AGENT_SUPABASE_URL" ]; then
            echo "未配置 SUPABASE_URL secret，跳过本体同步检查"
            exit 0
          fi
          uv run --project backend python -m ontology_sync_check --yaml backend/ontology
