name: eval-gate
on: [push, pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -r backend/requirements.txt
      - run: uv run --project backend python -m seed.seed --out backend/seed/sample.db --seed 42
      # 本体编译（1B）：YAML → SQLite 产物，验证编译流水线 + SqliteStore 可读
      - run: uv run --project backend python -m ontology_compile --yaml backend/ontology --out /tmp/ontology.db --commit
      - run: DATA_AGENT_ONTOLOGY_STORE=sqlite DATA_AGENT_ONTOLOGY_DB=/tmp/ontology.db uv run --project backend python -m eval.eval
      - run: uv run --project backend python -m eval.eval
      # 引擎单元测试（安全/方言/可观测/元数据/建模/路径D/本体存储，88 项）
      - run: uv run --project backend python -m unittest discover -s tests
      # DSH 侧配置回归（patch 格式 / upsert 幂等）
      - run: uv run --project backend python -m unittest discover -s ../dsh-side
