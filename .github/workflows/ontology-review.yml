name: ontology-review
# Git 评审闭环：PR 触发的本体检查——防「YAML 与 Supabase 真源漂移」+
# 编译验证 + 变更说明。评审人看 PR diff，CI 把关。
on:
  pull_request:
    paths:
      - 'backend/ontology/**'   # 仅本体变更触发

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -r backend/requirements.txt

      # 1. 编译验证：PR 的 YAML 能否编译成 SQLite 产物
      - name: Ontology compile check
        run: |
          uv run --project backend python -m ontology_compile \
            --yaml backend/ontology --out /tmp/ontology.db
          echo "✅ YAML 可编译"

      # 2. 回归测试（sqlite 模式跑 eval，验证变更不破坏引擎）
      - name: Regression (sqlite store)
        run: |
          uv run --project backend python -m seed.seed --out backend/seed/sample.db --seed 42
          DATA_AGENT_ONTOLOGY_STORE=sqlite DATA_AGENT_ONTOLOGY_DB=/tmp/ontology.db \
            uv run --project backend python -m eval.eval

      # 3. 一致性检查：PR 的 YAML vs Supabase 真源（配置 Secrets 后启用）
      - name: Ontology sync check (optional)
        if: ${{ secrets.SUPABASE_URL != '' }}
        env:
          DATA_AGENT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DATA_AGENT_SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          uv run --project backend python -m ontology_sync_check --yaml backend/ontology
          # exit=1（不一致）说明 PR 的 YAML 与真源有漂移：
          # 若 PR 是「评审真源变更」→ export 应已同步，不一致需人工确认方向

      # 4. 变更说明（评审辅助）
      - name: Change summary
        run: |
          echo "## 本体变更文件" >> $GITHUB_STEP_SUMMARY
          git diff --name-only origin/main...HEAD -- backend/ontology/ \
            | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
          echo "### 变更行数" >> $GITHUB_STEP_SUMMARY
          git diff --stat origin/main...HEAD -- backend/ontology/ >> $GITHUB_STEP_SUMMARY || true
