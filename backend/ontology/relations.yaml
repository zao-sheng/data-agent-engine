# ============================================================
# Ontology · 关系（OAG 图遍历的边 + 翻译引擎 JOIN 链的唯一来源）
# 约束：
#   * join_key 一律来自这里，翻译引擎永不猜测 JOIN
#   * 同一对象对之间可有多条边（如 Payment→Product / Refund→Payment）
#   * type 语义：contains（包含）/ fulfills（履约于）/ places（发生者）/
#               belongs_to（属于）/ refunds（退款自）/ 自定义
#   * description 为业务语义说明，OAG traverse 展示（供 LLM 判断路径合理性）
# ============================================================

relations:
  # 下单域
  - {source: Order, target: Product,   type: contains,   join_key: product_id, cardinality: "N:1",
     description: 一笔订单包含一个产品（可多次购买）}
  - {source: Order, target: Store,     type: fulfills,   join_key: store_id,   cardinality: "N:1",
     description: 订单在门店履约/下单}
  - {source: Order, target: ActiveUser,type: places,     join_key: user_id,    cardinality: "N:1",
     description: 订单由用户创建}

  # 支付域（支付表冗余 product_id/store_id/region_id/user_id，可直连维度）
  - {source: Payment, target: Product,   type: contains,   join_key: product_id, cardinality: "N:1",
     description: 一笔支付对应一个产品}
  - {source: Payment, target: Store,     type: fulfills,   join_key: store_id,   cardinality: "N:1",
     description: 支付发生在门店}
  - {source: Payment, target: Region,    type: belongs_to, join_key: region_id,  cardinality: "N:1",
     description: 支付归属区域（权限列）}
  - {source: Payment, target: ActiveUser,type: places,     join_key: user_id,    cardinality: "N:1",
     description: 支付由用户完成}

  # 消费域
  - {source: Consume, target: Product,   type: contains,   join_key: product_id, cardinality: "N:1",
     description: 消费核销对应一个产品}
  - {source: Consume, target: Store,     type: fulfills,   join_key: store_id,   cardinality: "N:1",
     description: 到店核销发生在门店}
  - {source: Consume, target: Region,    type: belongs_to, join_key: region_id,  cardinality: "N:1",
     description: 消费归属区域}

  # 退款域（退款表冗余 region_id/store_id，且经 pay_id 关联支付）
  - {source: Refund, target: Payment,    type: refunds,    join_key: pay_id,     cardinality: "N:1",
     description: 退款针对一笔支付（退款单关联支付单）}
  - {source: Refund, target: Region,     type: belongs_to, join_key: region_id,  cardinality: "N:1",
     description: 退款归属区域}
  - {source: Refund, target: Store,      type: fulfills,   join_key: store_id,   cardinality: "N:1",
     description: 退款发生在门店}

  # 维度间（门店→区域：供跨维度路径 BFS）
  - {source: Store, target: Region,      type: belongs_to, join_key: region_id,  cardinality: "N:1",
     description: 门店属于区域（城市/大区层级）}
