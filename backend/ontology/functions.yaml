# ============================================================
# Ontology · 指标/函数（MQL metric 的来源）
# 约束：
#   * formula 只允许白名单函数（SUM/COUNT/AVG/MAX/MIN/DISTINCT）+ 属性名 + 运算符，
#     翻译引擎按 AST 编译，禁止自由 SQL 字符串拼接
#   * owner：指标归属的业务对象（决定事实表候选集）
#   * pre_aggregated 在 objects.yaml 的 source_tables 里声明（{指标名: 物理列}）
#
# 治理字段（OAG 检索与确认环节展示）：
#   domain     —— 业务域（缺省跟随 owner 对象）
#   category   —— 指标分类（规模/质量/效率/增长/财务…）
#   status     —— active | draft | deprecated（废弃指标翻译时不被新查询命中）
#   data_owner —— 指标责任人（业务方）
#   unit       —— 指标单位（元/笔/人/次）
#   tags       —— 治理标签
# ============================================================

functions:
  - name: gmv
    family: gmv
    variant_label: 支付口径
    display_name: GMV（支付口径）
    description: 有效支付金额合计（口径：is_valid=1 的支付单，不含退款冲减）
    owner: Payment
    domain: ord
    category: 规模
    status: active
    data_owner: 财务分析组
    unit: 元
    tags: [核心, 财务, 监管]
    formula: "SUM(pay_amount)"
    required_filters: ["is_valid = 1"]
    default_of_family: true
    supported_dimensions: [channel, product_type, category, store_type, city, region_name, province, user_level, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "必须过滤 is_valid=1；不含退款冲减；支付口径 ≠ 下单口径"
    version: v1.0

  - name: order_gmv
    family: gmv
    variant_label: 下单口径
    display_name: GMV（下单口径）
    description: 有效下单金额合计（口径：is_valid=1 的订单，未支付也算）
    owner: Order
    domain: ord
    category: 规模
    status: active
    data_owner: 交易分析组
    unit: 元
    tags: [核心]
    formula: "SUM(order_amount)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [product_type, category, store_type, city, region_name, province, order_status, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "下单口径：下单金额（未支付也算），≠ 支付 GMV；必须过滤 is_valid=1"
    version: v1.0

  - name: consume_gmv
    family: gmv
    variant_label: 消费口径
    display_name: GMV（消费口径）
    description: 有效到店消费/核销金额合计
    owner: Consume
    domain: ord
    category: 规模
    status: active
    data_owner: 交易分析组
    unit: 元
    tags: [核心]
    formula: "SUM(consume_amount)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [product_type, category, store_type, city, region_name, province, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "消费口径：核销金额，≠ 支付 GMV"
    version: v1.0

  - name: order_count
    display_name: 订单量
    description: 有效下单数（去重订单号）
    owner: Order
    domain: ord
    category: 规模
    status: active
    data_owner: 交易分析组
    unit: 笔
    tags: [核心]
    formula: "COUNT(DISTINCT order_id)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [product_type, category, store_type, city, region_name, province, order_status, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "必须过滤 is_valid=1；按下单表统计"
    version: v1.0

  - name: avg_order_amount
    display_name: 平均客单价
    description: 有效支付金额均值，按订单粒度计算（支付口径）
    owner: Payment
    domain: ord
    category: 效率
    status: active
    data_owner: 财务分析组
    unit: 元/单
    tags: [核心]
    formula: "SUM(pay_amount) / COUNT(DISTINCT order_id)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [channel, product_type, category, store_type, city, region_name, province, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "不要直接 AVG(pay_amount)，需先按订单去重再计算"
    version: v2.0

  - name: pay_count
    display_name: 支付笔数
    description: 有效支付单数
    owner: Payment
    domain: ord
    category: 规模
    status: active
    data_owner: 交易分析组
    unit: 笔
    tags: []
    formula: "COUNT(pay_id)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [channel, product_type, category, store_type, city, region_name, province, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: ""
    version: v1.0

  - name: consume_amount
    display_name: 消费金额
    description: 有效到店消费/核销金额合计
    owner: Consume
    domain: ord
    category: 规模
    status: active
    data_owner: 交易分析组
    unit: 元
    tags: []
    formula: "SUM(consume_amount)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [product_type, category, store_type, city, region_name, province, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "消费金额 ≠ 支付金额；消费是核销口径"
    version: v1.0

  - name: refund_amount
    display_name: 退款金额
    description: 有效退款金额合计
    owner: Refund
    domain: ord
    category: 财务
    status: active
    data_owner: 财务分析组
    unit: 元
    tags: [财务, 监管]
    formula: "SUM(refund_amount)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [store_type, city, region_name, province, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "退款金额统计退款表，不冲减 GMV"
    version: v1.0

  - name: refund_count
    display_name: 退款订单量
    description: 有效退款订单量（退款笔数）：Refund 事实表有效退款记录数
    owner: Refund
    domain: ord
    category: 交易
    status: active
    data_owner: 交易数据组
    unit: 笔
    tags: [财务, 监管]
    formula: "COUNT(*)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [store_type, city, region_name, province, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: "退款订单量=退款记录笔数（COUNT(*)，非去重订单数）；预聚合表已内置 is_valid=1 过滤；不冲减 GMV"
    version: v1.0

  - name: order_user_cnt
    display_name: 下单用户数
    description: 有效下单的去重用户数
    owner: Order
    domain: ord
    category: 增长
    status: active
    data_owner: 用户分析组
    unit: 人
    tags: [增长]
    formula: "COUNT(DISTINCT user_id)"
    required_filters: ["is_valid = 1"]
    supported_dimensions: [region_name, store_type, city, order_date]
    supported_granularities: [day, week, month, quarter, year]
    do_not: ""
    version: v1.0
